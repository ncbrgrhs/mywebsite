<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Bucket List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>My Bucket List</h1>
    <p>Capture the things you want to do—and watch them become real.</p>
  </header>

  <main class="app-main">
    <section class="card">
      <h2>Add a new item</h2>
      <form id="bucket-form">
        <div class="form-row">
          <label for="title">Title *</label>
          <input id="title" type="text" required placeholder="Visit Japan, Learn guitar..." />
        </div>

        <div class="form-row">
          <label for="category">Category</label>
          <input id="category" type="text" placeholder="Travel, Skill, Adventure..." />
        </div>

        <div class="form-row">
          <label for="targetDate">Target date</label>
          <input id="targetDate" type="date" />
        </div>

        <div class="form-row">
          <label for="notes">Notes</label>
          <textarea id="notes" rows="3" placeholder="Why this matters, how you’ll do it..."></textarea>
        </div>

        <button type="submit" class="btn primary">Add to list</button>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Bucket list items</h2>
        <select id="filter">
          <option value="all">Show: All</option>
          <option value="active">Show: Not done</option>
          <option value="completed">Show: Completed</option>
        </select>
      </div>

      <div class="progress">
        <div class="progress-label">
          <span id="stats-text">0 completed / 0 total</span>
        </div>
        <div class="progress-bar">
          <div id="progress-fill"></div>
        </div>
      </div>

      <ul id="bucket-list" class="bucket-list"></ul>

      <button id="clear-completed" class="btn secondary small">
        Clear completed items
      </button>
    </section>
  </main>

  <footer class="app-footer">
    <small>Saved locally in your browser. You can come back anytime.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
