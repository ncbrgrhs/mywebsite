<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Bucket List Scrapbook</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="scrap-hero">
    <h1>My Bucket List</h1>
    <p>Collected dreams, adventures, and stories.</p>
  </header>

  <main class="scrap-grid">

    <a class="scrap-card" href="entries/japan.html">
      <img src="../images/japan/1.jpg" alt="">
      <span class="scrap-label">Visit Japan</span>
      <span class="scrap-tape tape-top"></span>
      <span class="scrap-tape tape-bottom"></span>
    </a>

    <a class="scrap-card" href="entries/skydive.html">
      <img src="../images/skydive/1.jpg" alt="">
      <span class="scrap-label">Go Skydiving</span>
      <span class="scrap-tape tape-top"></span>
      <span class="scrap-tape tape-bottom"></span>
    </a>

    <a class="scrap-card" href="entries/marathon.html">
      <img src="../images/marathon/1.jpg" alt="">
      <span class="scrap-label">Run a Marathon</span>
      <span class="scrap-tape tape-top"></span>
      <span class="scrap-tape tape-bottom"></span>
    </a>

  </main>
</body>
</html>
